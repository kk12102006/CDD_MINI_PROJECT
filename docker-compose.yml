services:
  web:
    build: .
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:5000
      - --workers
      - "2"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - app:app
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      APP_DATA_DIR: /app/data
      TESSERACT_CMD: /usr/bin/tesseract
    volumes:
      - attendance_data:/app/data
    restart: unless-stopped

  scheduler:
    build: .
    command: ["python", "notification_scheduler.py"]
    env_file: .env
    environment:
      APP_DATA_DIR: /app/data
      TESSERACT_CMD: /usr/bin/tesseract
    volumes:
      - attendance_data:/app/data
    restart: unless-stopped

volumes:
  attendance_data:
