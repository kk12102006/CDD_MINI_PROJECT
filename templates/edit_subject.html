{% extends "base.html" %}
{% block title %}Edit subject{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <div class="auth-intro">
                <span class="eyebrow">SUBJECT MANAGEMENT</span>
                <h1>Edit subject</h1>
                <p>Update the subject details and manually entered class total.</p>
            </div>
            <form method="post" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label" for="subject_name">Subject name</label>
                    <input class="form-control" id="subject_name" name="subject_name" type="text"
                           maxlength="120"
                           value="{{ form_data.subject_name if form_data else subject.subject_name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="total_scheduled_classes">Total scheduled classes</label>
                    <input class="form-control" id="total_scheduled_classes" name="total_scheduled_classes"
                           type="number" min="1" step="1"
                           value="{{ form_data.total_scheduled_classes if form_data else subject.total_scheduled_classes }}" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="minimum_percentage">Minimum required attendance percentage</label>
                    <div class="input-group">
                        <input class="form-control" id="minimum_percentage" name="minimum_percentage"
                               type="number" min="1" max="100" step="0.01"
                               value="{{ form_data.minimum_percentage if form_data else subject.minimum_percentage }}" required>
                        <span class="input-group-text percentage-addon">%</span>
                    </div>
                </div>
                <button class="btn btn-primary w-100 btn-lg auth-submit" type="submit">Save changes <span aria-hidden="true">→</span></button>
            </form>
            <p class="auth-switch"><a href="{{ url_for('subjects.list_subjects') }}">← Back to subjects</a></p>
        </div>
    </div>
</section>
{% endblock %}
